# ============================================================================
# Config cho benchmark 3 phiên bản: Python thuần / Rust thuần / Hybrid PyO3
# Đồ án: hệ thống tự động transpile Python -> Rust cho hàm tiền xử lý ảnh AI
# Case study nguồn: github.com/viraj7/Computer-Vision-Image-processing
# ============================================================================

data:
  # "repo_sample"     : ảnh mẫu đặt trong data/sample_input/ (copy từ repo viraj7,
  #                      vd chess.jpg, horse.jpg, monument.jpg, pyramid.jpg,
  #                      reindeer.jpg, scene.jpg, starfish.jpg).
  # "library_dataset" : ảnh lấy từ skimage.data hoặc torchvision.datasets, dùng để
  #                      kiểm tra tương thích định dạng input với các hàm gốc.
  source: repo_sample

  sample_input_dir: data/sample_input
  # Đã tải sẵn 7 ảnh thật từ repo viraj7 vào sample_input_dir (chess.jpg,
  # horse.jpg, monument.jpg, pyramid.jpg, reindeer.jpg, scene.jpg,
  # starfish.jpg). Đổi tên file ở đây để bench với ảnh khác.
  # Để trống (null) -> loader tự sinh ảnh placeholder xám (grayscale) để demo end-to-end.
  sample_input_file: chess.jpg

  # Dùng khi source == library_dataset.
  library_dataset_name: camera        # skimage: camera | coins | astronaut | checkerboard | moon | page
  library_dataset_backend: skimage    # skimage | torchvision

# ----------------------------------------------------------------------------
# Stage 4 -- LLM transpile (stage4_llm_transpile/). CHỈ dùng bởi run_pipeline.py.
# stage6_benchmark/bench.py chạy độc lập KHÔNG bao giờ đụng tới mục này.
# ----------------------------------------------------------------------------
llm:
  # MẶC ĐỊNH TẮT: pipeline cũ (điền tay code Rust vào versions/) vẫn chạy y
  # hệt khi false -- không ai bị bắt buộc phải có LLM mới dùng được benchmark.
  enabled: false
  backend: api             # api (Anthropic) | local (server OpenAI-compatible, vd Ollama)
  # 1 = chỉ Generator Agent (bước quyết định accept/reject dùng RULE đơn giản:
  #     accept nếu speedup rust_pure/python_pure > 1.0, dừng sau 1 vòng).
  # 2 = thêm Decision Agent bằng LLM (phỏng theo POLO Fig.5) để quyết định
  #     accept/reject + có tiếp tục tối ưu không.
  num_agents: 1
  # HAI VAI TRÒ, HAI MODEL KHÁC NHAU.
  # Generator Agent (sinh/sửa code Rust) và Decision Agent (đánh giá kết quả
  # đo) dùng CHUNG 1 kết nối tới server, nhưng mỗi bên gọi model riêng:
  # generator nên là model mạnh về code, decision có thể nhỏ hơn.
  # Nếu chỉ khai báo `model:` (khoá cũ) thì cả 2 vai trò dùng chung model đó.
  api:
    generator_model: claude-sonnet-4-5-20250929
    decision_model: claude-sonnet-4-5-20250929
    # Với backend=api thường 1 model là đủ, nên 2 dòng trên để giống nhau.
    # API key LUÔN đọc từ biến môi trường ANTHROPIC_API_KEY -- KHÔNG bao giờ
    # ghi key vào file này.
  local:
    # MẶC ĐỊNH trỏ vào tên service "ollama" trong docker-compose network.
    # Bên TRONG container benchmark, "localhost" trỏ về chính container đó,
    # KHÔNG sang được container ollama -- phải dùng tên service.
    # Chạy ngoài Docker (trên máy cá nhân): set biến môi trường
    #   OLLAMA_BASE_URL=http://localhost:11434
    base_url: "${OLLAMA_BASE_URL:-http://ollama:11434}"
    # "ollama" -> gọi POST /api/chat (API native). BẮT BUỘC dùng kiểu này nếu
    #             muốn đặt num_ctx theo từng lời gọi, vì endpoint
    #             /v1/chat/completions KHÔNG chở được options.num_ctx.
    # "openai" -> gọi POST /v1/chat/completions (cho vLLM, LM Studio, ...).
    api_style: "${OLLAMA_API_STYLE:-ollama}"
    # Nhớ pull CẢ HAI model về ollama trước khi chạy:
    #   docker compose exec ollama ollama pull devstral-small-2:latest
    #   docker compose exec ollama ollama pull qwen3:14b
    generator_model: "${OLLAMA_GENERATOR_MODEL:-devstral-small-2:latest}"
    decision_model: "${OLLAMA_DECISION_MODEL:-qwen3:14b}"
    # Cửa sổ ngữ cảnh riêng từng vai trò.
    # CẢNH BÁO VRAM: tăng num_ctx làm tăng bộ nhớ cho KV cache gần như tuyến
    # tính. CHỈ tăng khi thực sự thấy log cảnh báo prompt bị cắt
    # ("Ollama sẽ CẮT BỚT phần đầu"), đừng tăng phòng hờ.
    # Generator cần rộng hơn vì prompt chứa code + context từ Stage 3;
    # Decision chỉ nhận số liệu đo nên hẹp hơn là đủ.
    generator_num_ctx: "${OLLAMA_GENERATOR_NUM_CTX:-32768}"
    decision_num_ctx: "${OLLAMA_DECISION_NUM_CTX:-16384}"

# Stage 2 -- Decision Gate (stage2_decision_gate/gate.py): pre-filter hotspot
# trước khi đưa qua Stage 3/4. KHÁC Decision Agent ở Stage 6 (accept/reject
# SAU khi đã dịch và đo tốc độ).
decision_gate:
  enabled: true

# ----------------------------------------------------------------------------
# Stage 5 -- Compiler-in-the-loop: biên dịch code Rust do LLM sinh, phân loại
# lỗi, gửi lại Generator Agent sửa (tối đa max_retries vòng).
# ----------------------------------------------------------------------------
# ----------------------------------------------------------------------------
# Stage 6 -- Vòng tối ưu TỐC ĐỘ (khác hẳn vòng sửa lỗi biên dịch ở Stage 5).
# Mỗi vòng: đo tốc độ -> Decision Agent quyết accept/reject + continue/stop
# -> nếu continue thì Generator Agent tối ưu tiếp theo chiến lược nó đề xuất.
# ----------------------------------------------------------------------------
optimization_loop:
  # TRẦN CỨNG. Decision Agent được dừng SỚM hơn, nhưng dù nó có đề xuất
  # "CONTINUE" bao nhiêu lần đi nữa thì tới vòng này là ép dừng.
  max_rounds: 3
  # Timeout cho `maturin develop --release` giữa các vòng. Build Rust bản
  # release có thể chậm, nhất là lần đầu phải tải crate về.
  build_timeout_sec: 300

# ----------------------------------------------------------------------------
# Kiểm tra ĐÚNG ĐẮN (correctness): so khớp output Python vs Rust.
# Chạy SAU Stage 5, TRƯỚC Stage 6 -- hàm nào MISMATCH thì KHÔNG được đem đi
# đo tốc độ (đo tốc độ của bản dịch sai là vô nghĩa).
# ----------------------------------------------------------------------------
correctness:
  enabled: true
  rtol: 0.00001    # 1e-5, cho np.allclose / math.isclose
  atol: 0.00000001 # 1e-8

# ----------------------------------------------------------------------------
# PHA A..F -- Oracle MỨC REPO: chạy chính bộ test Python của repo làm chuẩn.
#
# VÌ SAO CẦN: so output hàm-với-hàm không chứng minh được "thay hotspot bằng
# Rust mà repo vẫn chạy đúng". Với bản hybrid (chỉ vài hàm là Rust), oracle
# đúng phải là BỘ TEST GỐC của repo.
#
# Mục này CHỈ dùng khi target.mode = file|repo hoặc dataset.enabled = true.
# Chế độ legacy (target.mode=function, 4 hàm viraj7) KHÔNG đọc mục này.
# ----------------------------------------------------------------------------
repo_oracle:
  enabled: true

  # Dataset được mount CHỈ ĐỌC, mà pytest cần ghi cache và Pha D cần chèn
  # extension -> phải copy repo ra đây trước khi chạy.
  # Để TRỐNG -> code tự dùng `tempfile.gettempdir()/rtb_work`, hợp cả Linux
  # lẫn Windows. Đặt RTB_WORK_DIR nếu muốn chỉ định (vd ổ đĩa còn nhiều chỗ).
  work_root: "${RTB_WORK_DIR:-}"

  # Xoá venv sau mỗi repo. Để true khi cần gỡ lỗi 1 repo cụ thể; chạy cả
  # dataset thì PHẢI để false, nếu không đĩa máy thuê đầy rất nhanh.
  keep_venv: false
  # Xoá luôn bản copy repo (giữ lại thì còn xem được crate + shim đã sinh).
  cleanup_work_dir: false

  # Giới hạn thời gian.
  test_timeout_sec: 600        # mỗi lần chạy pytest (baseline, rồi hybrid)
  repo_time_budget_sec: 1800   # cả repo, kể cả build Rust và gọi LLM

  # Pha B -- ghi đối số thật.
  max_captured_calls: 20       # số lời gọi ghi lại cho MỖI hotspot
  max_arg_bytes: 5242880       # 5MB cho MỖI đối số; vượt -> UNREPLAYABLE_ARGS

  # Pha D -- phạm vi chữ ký Rust hỗ trợ.
  # "extended"    (mặc định): Tầng 1 (kiểu gốc -> Rust thuần) + Tầng 2 (đối
  #               tượng -> kernel Rust + shim Python tháo/đóng gói).
  # "native_only": CHỈ Tầng 1. Hotspot cần shim bị loại thành UNSUPPORTED_KIND
  #               thay vì đo một thứ khác -- dùng khi cần số liệu "sạch".
  signature_support: "${RTB_SIGNATURE_SUPPORT:-extended}"

# ----------------------------------------------------------------------------
# PHẦN 2 -- ABLATION: có và không có context graph.
#
# MỤC TIÊU: đo RIÊNG tác động của context lân cận PCG/PSG lên chất lượng code
# Rust do Generator sinh, theo thiết kế đối chứng của POLO (một vòng, bỏ đa
# vòng để không lẫn tác động của vòng tối ưu vào tác động của context).
#
# HAI NHÁNH CHỈ KHÁC ĐÚNG MỘT THỨ trong prompt:
#   graph -- có khối "Context lân cận của hotspot" (hàm gọi hotspot, hàm
#            hotspot gọi, lớp chứa nó, tham chiếu tĩnh).
#   none  -- BỎ HẲN khối đó. VẪN giữ: source hotspot, chữ ký, kiểu đối số
#            quan sát được, ví dụ vào/ra từ test. Mấy thứ này là đặc tả tối
#            thiểu để viết được chữ ký PyO3, KHÔNG tính là context graph --
#            bỏ chúng đi thì hai nhánh thành hai bài toán khác nhau.
#
# Cả hai prompt sinh từ CÙNG một hàm build (`generator_agent.
# build_signature_prompt`), khác nhau bởi cờ `include_graph_context`.
# ----------------------------------------------------------------------------
ablation:
  enabled: false
  arms: [graph, none]
  repeats: 1
  # Seed GỐC. Seed thật của mỗi lời gọi = hash ổn định của
  # (seed, repo, hotspot, arm, repeat) -- xem ablation.py::seed_for.
  seed: 1234
  # Nhiệt độ thấp cho cả 2 nhánh: giảm phương sai để chênh lệch quan sát được
  # phản ánh context chứ không phản ánh may mắn lấy mẫu.
  temperature: 0.2
  # Số cặp bất đồng tối thiểu để được phép kết luận thống kê. Dưới ngưỡng này
  # báo cáo CHỈ in số đếm kèm ghi chú cỡ mẫu nhỏ, không kết luận.
  min_discordant_pairs: 10

  # NHIỄU NỀN (PHA 5). Chạy thêm một lượt sinh ĐỘC LẬP của CHÍNH nhánh `graph`
  # (cùng prompt, seed khác) để đo mức bất đồng do ngẫu nhiên của LLM.
  #
  # VÌ SAO BẮT BUỘC CÓ khi muốn kết luận: nếu graph-vs-none bất đồng ở 3 hotspot
  # mà graph-vs-graph cũng bất đồng ở 3, thì con số đầu không nói gì về context
  # -- nó chỉ nói LLM trả lời khác nhau giữa hai lần gọi. Thiếu nhiễu nền là
  # cách dễ nhất để rút ra một "phát hiện" không tồn tại.
  noise_floor: false
  # Giới hạn số hotspot chạy lượt lặp. Mỗi hotspot là một lời gọi LLM nữa.
  noise_floor_max_hotspots: 10

compiler_loop:
  enabled: true
  # Số lần gọi lại Generator Agent để sửa lỗi biên dịch, TRƯỚC khi bỏ cuộc.
  max_retries: 3
  # Lệnh kiểm tra biên dịch. `cargo check` nhanh hơn `cargo build` vì không
  # sinh binary, đủ để bắt lỗi cú pháp/kiểu/borrow-checker.
  cargo_timeout_sec: 300

# ----------------------------------------------------------------------------
# Dataset đánh giá quy mô lớn (RepoTransBench). KHÔNG hardcode đường dẫn máy
# nào: đọc từ biến môi trường trước, giá trị sau ":-" chỉ là dự phòng khi
# biến chưa được set (xem config_loader.py::expand_env_vars).
#
# Trên máy thuê GPU, teammate chỉ cần:
#     export REPOTRANSBENCH_ROOT=/app/data/RepoTransBench/source_projects/Python
# hoặc để nguyên mặc định và mount dataset vào đúng đường dẫn đó qua
# REPOTRANSBENCH_HOST_PATH trong .env (xem docker-compose.yml).
# ----------------------------------------------------------------------------
dataset:
  # false = bỏ qua hẳn, pipeline chạy trên target đơn lẻ như bình thường.
  enabled: false
  source_root: "${REPOTRANSBENCH_ROOT:-/app/data/RepoTransBench/source_projects/Python}"
  # Giới hạn số repo đem chạy (0 = không giới hạn). Hữu ích khi thử nghiệm
  # trước trên vài repo thay vì cả dataset.
  max_repos: 0

# ----------------------------------------------------------------------------
# [LEGACY] Mục cũ, giữ lại để không phá config của ai đang dùng. Stage 4 mới
# (stage4_llm_transpile/) đọc mục `llm:` ở trên, KHÔNG đọc mục này.
# ----------------------------------------------------------------------------
model_backend:
  # "api"  : gọi LLM qua API (Anthropic/OpenAI/...), đọc API key từ biến môi trường.
  # "local": gọi model local qua endpoint nội bộ (vd Ollama, vLLM).
  provider: api

  api:
    # Tên biến môi trường chứa API key -- KHÔNG hard-code key vào file này.
    api_key_env: ANTHROPIC_API_KEY
    model_name: claude-sonnet-5
    # TODO: điền base_url nếu dùng proxy nội bộ; để null nghĩa là dùng default của SDK.
    base_url: null

  local:
    # TODO: điền endpoint model local thật (vd Ollama http://localhost:11434,
    # hoặc vLLM OpenAI-compatible server).
    endpoint: http://localhost:11434
    model_name: codellama:13b

benchmark:
  iterations: 20
  warmup: 5
  # Chỉ dùng khi target.mode = "function" (xem bên dưới). Tên hàm cần đo,
  # PHẢI khớp key trong PIPELINE_REGISTRY của versions/python_pure/pipeline.py
  # và versions/hybrid_pyo3/pipeline.py. Ánh xạ sang file gốc trong repo
  # viraj7 -- xem README.md mục "Ánh xạ hàm gốc".
  functions:
    - edge_det           # edge_detection.py -> Canny-style edge detection
    - harris              # "harris corner detection.py" -> Harris corner detection
    - hess_corner_det      # "hessian corner detection.py" -> Hessian corner detection
    - im_threshold          # image_entropy.py -> entropy-based background/foreground split

# Cấp độ benchmark -- xem README.md mục "3 cấp độ benchmark".
target:
  # "function" (MẶC ĐỊNH): dùng thẳng danh sách benchmark.functions ở trên,
  #             y hệt hành vi trước khi có stage0_graph/ -- KHÔNG đổi gì.
  # "file"    : trỏ target.source vào 1 file .py, tự phát hiện + xếp hạng hàm
  #             hotspot bằng stage0_graph/ (PCG/PSG + FuncRank) thay cho danh
  #             sách cứng.
  # "repo"    : trỏ target.source vào 1 thư mục nhiều file .py, HOẶC 1 URL
  #             GitHub (input/intake.py sẽ tự `git clone --depth 1` vào
  #             data/cloned_repos/<tên_repo>/ rồi dùng bản local đó).
  mode: function
  # Bắt buộc khi mode=file|repo. Bỏ qua khi mode=function.
  # Chấp nhận CẢ HAI dạng -- input/intake.py là nơi DUY NHẤT phân biệt:
  #   - đường dẫn local:  data/reference_repo
  #   - URL GitHub:       https://github.com/viraj7/Computer-Vision-Image-processing
  # (Tên cũ `target.path` vẫn được đọc để tương thích ngược, nhưng sẽ có
  # cảnh báo deprecation -- nên đổi sang `source`.)
  source: null

# Chỉ dùng khi target.mode = file | repo -- điều khiển stage0_graph/builder.py
# (PCG/PSG), stage0_graph/rank.py (FuncRank), stage1_profiling/dynamic_profiler.py.
graph:
  # Số hàm hotspot (theo FuncRank) được chọn làm ứng viên benchmark.
  top_k_hotspots: 5

  # --- Chọn hotspot cho CHẾ ĐỘ REPO ĐỘNG (không ảnh hưởng chế độ legacy) ---
  #
  # VÌ SAO TÁCH LÀM 2 SỐ: trên dataset thật, phần lớn hotspot hạng cao bị loại
  # ở bước ghi/phát lại đối số (đo được trên piskvorky_sqlitedict: 5/5 hotspot
  # bị loại, 3 trong đó là method của đối tượng giữ `_contextvars.Context`).
  # Lấy thẳng top-5 thì thường còn 0 hotspot để dịch, và ablation không có gì
  # để so. Nên: lấy POOL rộng, lọc bằng tiêu chí khách quan (phát lại được +
  # thuộc Tầng 1/2), rồi giữ `top_k_translate` hotspot ĐẦU TIÊN THEO ĐÚNG THỨ
  # TỰ FUNCRANK.
  #
  # CÔNG THỨC FUNCRANK KHÔNG ĐỔI và KHÔNG có điểm cộng thủ công nào -- thứ tự
  # vẫn thuần FuncRank, chỗ này chỉ mở rộng phạm vi xét rồi lọc.
  candidate_pool: 30
  top_k_translate: 5

  # "static"  (MẶC ĐỊNH, hành vi CŨ giữ nguyên): PCG chỉ từ phân tích tĩnh
  #            (tree-sitter/ast), FuncRank = PageRank thuần trên cấu trúc
  #            liên kết. Không chạy profiling, không cần Scalene.
  # "dynamic": build PCG ĐỘNG theo phương pháp POLO (Bai et al., IJCAI-25,
  #            Section 3.1) -- chạy target dưới profiling với ảnh mẫu thật,
  #            đo % thời gian + số lần gọi thật mỗi hàm/mỗi cạnh gọi hàm,
  #            FuncRank dùng công thức Eq.1-2 của POLO (stage0_graph/rank.py::
  #            func_rank_dynamic). Hàm KHÔNG được thực thi trong lần
  #            profiling (không có implementation, hoặc code path không
  #            chạy tới) tự động fallback về điểm tĩnh (rank_source=
  #            "static_fallback") -- xem README mục "PCG động vs tĩnh".
  build_mode: static

  # Chỉ dùng khi build_mode = dynamic.
  dynamic:
    # "scalene" (đã chốt cho Stage 1, đồng bộ công cụ) hoặc "cprofile" (thay
    # thế tạm, tự động dùng nếu chưa cài được Scalene -- xem
    # stage1_profiling/dynamic_profiler.py). Trường này chỉ mang tính ghi chú/tài liệu;
    # việc chọn profiler thực tế là TỰ ĐỘNG (thử Scalene trước, cProfile
    # fallback nếu module `scalene` không import được).
    profiler: scalene
    # Số lần lặp workload (ảnh mẫu thật trong data/sample_input/) khi
    # profiling động -- càng nhiều, số liệu count/time càng ổn định, nhưng
    # cũng chạy Scalene lâu hơn.
    workload_iterations: 20

paths:
  results_dir: results
  # rust_pure được đo IN-PROCESS qua extension PyO3 (không phải subprocess
  # binary nữa -- xem versions/rust_pure/pipeline.py). Build bằng:
  #   cd versions/rust_pure/pyo3_ext && maturin develop --release
  # Không cần khai báo path ở đây: sau khi `maturin develop` cài extension
  # vào venv, Python tự import được `rust_pure_ext`, giống hybrid_pyo3_ext.
