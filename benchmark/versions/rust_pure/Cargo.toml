[package]
name = "rust_pure"
version = "0.1.0"
edition = "2021"

# TODO: khi điền logic thật, có thể cần thêm:
#   image = "0.25"      # đọc/ghi ảnh thật (thay vì chỉ nhận width/height qua CLI)
#   ndarray = "0.16"    # thao tác mảng nhiều chiều tiện hơn Vec<u8> thô
